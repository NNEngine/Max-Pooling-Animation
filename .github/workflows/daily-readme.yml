name: Daily README Commit

on:
  schedule:
    - cron: "0 0 * * *"   # Once per day (UTC)
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update README
        run: |
          echo "- Updated on $(date)" >> README.md

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add README.md
          git commit -m "Daily README update $(date)" || echo "No changes"
          git push
